apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-service
  namespace: jumptotech-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: news-service
  template:
    metadata:
      labels:
        app: news-service
    spec:
      containers:
        - name: news-service
          image: juzonb1r/jumptotech-news-service:a24d1db
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: news-service
  namespace: jumptotech-dev
spec:
  selector:
    app: news-service
  ports:
    - port: 8000
      targetPort: 8000