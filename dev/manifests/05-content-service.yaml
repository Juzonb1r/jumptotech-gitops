apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: jumptotech-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: local-registry:5000/jumptotech/content-service:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: jumptotech-dev
spec:
  selector:
    app: content-service
  ports:
    - port: 8000
      targetPort: 8000